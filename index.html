<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxCheck | 명품 정품 판별</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>✦ LuxCheck</h1>
<p class="subtitle">AI 기반 명품 정품 분석 서비스</p>

<div class="card">

<h2>상품 정보 입력</h2>
<select id="brand">
  <option value="">브랜드 선택</option>
  <option>샤넬</option>
  <option>루이비통</option>
  <option>구찌</option>
  <option>프라다</option>
  <option>디올</option>
  <option>기타</option>
</select>
<input type="file" id="image"<img id="preview" style="display:none; width:100%; margin-top:20px; border-radius:15px;">
<img id="preview" style="display:none; width:100%; margin-top:20px; border-radius:15px;">
<textarea id="text" placeholder="판매글 내용을 입력해주세요"></textarea>

<button onclick="check()">정품 분석하기</button>

<div id="result"></div>

</div>

<p class="notice">
※ AI 분석은 참고용이며 최종 감정은 전문가 확인이 필요합니다.
</p>

</div>
<h1>테스트중</h1>
<script src="script.js"></script>

</body>
</html>
